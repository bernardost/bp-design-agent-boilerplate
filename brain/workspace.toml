# workspace.toml — the one file `/setup` writes and every script reads.
#
# Nothing in brain/*.py holds a project constant of its own; they all read this through
# brain/config.py. Edit it by hand or re-run `/setup` to change an answer.
# Placeholders in {{braces}} are unfilled — `doctor.py` reports them.

[engagement]
# The whole relationship this workspace serves: one client, one owner, one meeting stream.
# (Older clones call this table `[project]`; both are read, `[engagement]` wins.)
name = "{{ENGAGEMENT_NAME}}"       # page titles, kickers, the tracker push
owner = "{{OWNER}}"
# True only in the boilerplate repo itself. `/setup` sets it false in a clone, which is
# how `doctor.py` tells "this IS the template" from "a clone that never ran /setup".
is_template = true

[projects]
# The strands of work inside the engagement. One engagement often carries several: a
# meeting covers three of them at once, and the records must not blend. Every decision,
# insight, exploration, workshop, feed item and task names the strand it belongs to, and
# the projections filter on it — compartmentalize in the projection, never in the storage,
# because splitting `decisions/` per strand would trade away the one-owner rule for a
# filter you get free at render time.
#
# `keys` are lowercase-kebab and permanent (records cite them); `labels` are the display
# names, same order, and are what headings in tasks.md, now.md and plan.md use.
# One key here means a single-project workspace: nothing is tagged, nothing is filtered,
# and `doctor.py` asks for none of it. The ceremony arrives with the second key.
keys = ["{{PROJECT_KEY}}"]
labels = ["{{PRODUCT_NAME}}"]
# `all` is reserved: a record that governs the whole engagement rather than one strand.
#
# Where the work being designed actually lives, one entry per strand, `key: where`.
# A design project's product is often not in this repo: a Figma file, a live site, a deck.
work_lives = []                    # e.g. ["portal: figma.com/file/…", "site: staging.example.com"]

[tracker]
# The external tracker. `prefix = ""` means the project has no tracker: task pointers are
# then `—` (not yet projected) or `skip` (never projected).
name = "{{TRACKER_NAME}}"          # e.g. "Linear"; "" if the project has none
prefix = ""                        # the issue-key prefix, e.g. "PROJ" for PROJ-12

[tasks]
# The label vocabulary for brain/tasks.md. `bar` = inside the current stage's exit
# criterion; `deferred` = real work explicitly NOT a prerequisite for the current stage,
# which must never be presented as one. Labels put the stage question in the grammar, so
# "is this required before we can move on?" is a grep and not a judgement call.
labels = ["design", "research", "content", "handoff", "method", "blocked-on-external", "bar", "deferred"]

[git]
# See decision [[a-private-remote-and-push-as-you-go]]. A remote is what lets the same workspace open on a phone; recording
# the answer here IS the owner's say-so, so it is not asked again every session.
remote = false                     # true once a remote is configured and push is authorized
visibility = "private"             # "private" | "public" — public is an explicit choice
push_each_unit = true              # commit + push every completed unit of work, unprompted

[generation]
# Image and video generation, for design work that needs real assets rather than a CSS
# gradient standing in for art. A coding agent with no generator reaches for gradients,
# glows and shapes — `brain/lenses/craft.md` scores those as tells, so this is what lets it
# score better honestly.
#
# route: "" (none) | "builtin" (the agent's own tool) | "subscription" (drive another CLI
# that bills a seat) | "api" (a key in .env.agents).
route = ""
# Keys live in `.env.agents` at the repo root — gitignored, dev-only, and they must never
# ship inside a deliverable. Give them a tight spend limit; an agent in a loop is the exact
# shape of workload that empties an uncapped key.
env_file = ".env.agents"

[reminders]
# Where a reminder is actually delivered. **The repo cannot remind anyone.** A session only
# runs while the owner is at the machine, which is precisely when he does not need reminding,
# so "I'll remind you" with nothing outside this repo behind it is a promise that silently
# breaks. A reminder is a projection, like the tracker: `tasks.md` holds the truth and the
# channel holds the alarm.
#
# route: "" (none configured — say so and hand the owner the date, never pretend)
#        | "calendar"  an event with a notification; fires on the phone (recommended)
#        | "slack"     a scheduled message; genuinely fires, but 120 days out at most
#        | "manual"    the assistant never schedules, it only drafts and the owner sets it
#
# Gmail is deliberately absent: it can send now and draft, but it cannot send later, so it
# cannot carry a reminder for a future date. Recording the route here IS the owner's say-so
# for writing to that channel, so it is not asked every time.
route = ""
target = ""                        # calendar id, Slack channel or user id — "" means default
lead_time = "1 day"                # how far ahead of a deadline the reminder itself fires

[brief]
# `/brief` renders `brain/brief.html` — the page the owner reads and approves before the work
# moves. Publishing it as an artifact makes it readable on a phone and shareable with a
# client; it also sends whatever the brief quotes to an external service, which is exactly
# what the confidential rule below governs. Recording the answer here IS the owner's say-so,
# so it is not asked every time.
publish = false                    # true = also publish the page as an artifact and hand over the link

[confidential]
# Directories holding client or third-party material. Kept out of git from day one, and
# read-only to the assistant when they are source material from outside.
paths = ["context/"]
